[project]
name = "wev-ai"
version = "0.2.0"
description = "Local System-One decision model: typed questions in, calibrated probabilities out, one forward pass. General decisions and browser-agent steps; drop-in POST /v1/systemone."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
keywords = ["decision-model", "system-one", "browser-agent", "llm", "lora", "qwen", "calibration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "torch>=2.8",
    "transformers>=5.17,<6",
    "peft>=0.15",
    "pydantic>=2",
    "numpy",
    "safetensors",
    "huggingface_hub",
]

[project.scripts]
wev = "wev.cli:main"

[project.optional-dependencies]
serve = ["fastapi", "uvicorn"]
fast = ["flash-linear-attention"]   # Qwen3.5 (wev-4b v0.2) kernels on CUDA
train = ["datasets>=3.0", "lxml>=5", "cssselect", "pyarrow"]   # data converters (Mind2Web, NNetNav, WebChain, general corpora)
dev = ["pytest", "datasets>=3.0", "lxml>=5", "cssselect"]

[project.urls]
Homepage = "https://github.com/alanhuangyoo/wev"
Models = "https://huggingface.co/alanhuangya"
Issues = "https://github.com/alanhuangyoo/wev/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wev*"]
